<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Popup Previews</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e2e8f0;
    padding: 40px 20px;
  }
  .container {
    max-width: 500px;
    width: 100%;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 32px;
    text-align: center;
    color: #f8fafc;
  }
  .card {
    display: block;
    padding: 20px 24px;
    margin-bottom: 16px;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    text-decoration: none;
    color: #e2e8f0;
    transition: all 0.2s;
  }
  .card:hover {
    background: #263248;
    border-color: rgba(255,255,255,0.15);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .card h2 {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #f8fafc;
  }
  .card p {
    font-size: 13px;
    color: #94a3b8;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Popup Previews</h1>
  <a class="card" href="popup-supernova-v2.html">
    <h2>Supernova Stocks Popup</h2>
    <p>Gold/blue theme with animated chart and supernova pattern badge</p>
  </a>
  <a class="card" href="popup-v3.html">
    <h2>XGPT Popup</h2>
    <p>Dark theme with AI trading alerts and gradient accent colors</p>
  </a>
</div>
</body>
</html>
